---
# PR description auto-fill and Claude Code review (anthropics/claude-code-action).
# Requires: ANTHROPIC_API_KEY repository secret and the Claude GitHub App
# (https://github.com/apps/claude) or /install-github-app from Claude Code.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Claude narrative on open; Diff size on open and every push
  summarize:
    if: github.event.pull_request.draft == false && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Auto-fill PR description
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '';
            const isOpen = context.payload.action === 'opened';

            const hasContent = prBody.includes('[x]') ||
              (prBody.includes('## Description') &&
               prBody.split('## Description')[1]?.split('##')[0]?.replace(/<!--[\s\S]*?-->/g, '').trim().length > 0);

            const SKIP_PATTERNS = [
              /pubspec\.lock$/, /\.lock$/,
              /app_localizations(_(en|zh))?\.dart$/,
              /\.g\.dart$/, /\.freezed\.dart$/, /\.min\.(js|css)$/
            ];
            const MAX_DIFF_SIZE = 12000;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100
            });

            const categorize = (filename) => {
              const f = filename.replace(/\\/g, '/');
              if (/(^|\/)(\.cursor|\.github)(\/|$)/.test(f)) return 'other';
              if (
                /(^|\/)(test|tests|__tests__|e2e)(\/|$)/.test(f) ||
                /_test\.dart$/.test(f) ||
                /\.(test|spec)\.(ts|tsx|js|jsx|go)$/.test(f)
              ) return 'test';
              if (/(^|\/)docs(\/|$)/.test(f) || /\.(md|mdx)$/.test(f)) return 'docs';
              if (
                /(^|\/)(lib|src|api|app|cmd)(\/|$)/.test(f) ||
                /\.(dart|go|ts|tsx|js|jsx|py)$/.test(f)
              ) return 'code';
              return 'other';
            };

            const empty = () => ({ files: 0, add: 0, del: 0 });
            const cats = { test: empty(), docs: empty(), code: empty(), other: empty() };
            for (const f of files) {
              const c = cats[categorize(f.filename)];
              c.files += 1;
              c.add += f.additions || 0;
              c.del += f.deletions || 0;
            }
            const total = empty();
            for (const c of Object.values(cats)) {
              total.files += c.files;
              total.add += c.add;
              total.del += c.del;
            }
            const line = (label, c) =>
              `- **${label}:** ${c.files} files, +${c.add} / −${c.del}`;
            const DIFF_SIZE_START = '<!-- diff-size:start -->';
            const DIFF_SIZE_END = '<!-- diff-size:end -->';
            const diffSizeSection = [
              DIFF_SIZE_START,
              '## Diff size',
              line('Tests', cats.test),
              line('Docs', cats.docs),
              line('Non-test code', cats.code),
              line('Other', cats.other),
              line('Total', total),
              DIFF_SIZE_END
            ].join('\n');

            const upsertDiffSize = (body) => {
              const without = (body || '')
                .replace(/\n?<!-- diff-size:start -->[\s\S]*?<!-- diff-size:end -->/g, '')
                // Legacy unmarked Diff size: heading + metric bullets only.
                .replace(/\n?## Diff size\n(?:- \*\*[^\n]*\n?)*/g, '')
                .trim();
              const marker = '<!-- This is an auto-generated comment: release notes by coderabbit.ai -->';
              if (without.includes(marker)) {
                return without.replace(marker, `${diffSizeSection}\n\n${marker}`);
              }
              return without ? `${without}\n\n${diffSizeSection}` : diffSizeSection;
            };

            let body = prBody;
            let failReason = null;

            // Narrative Claude fill only when the PR is first opened and empty.
            // On Claude unavailability/failure, keep the original body and still
            // run upsertDiffSize below; fail the job afterward if required.
            if (isOpen && !hasContent) {
              if (!process.env.ANTHROPIC_API_KEY) {
                failReason = 'ANTHROPIC_API_KEY secret is not set.';
              } else {
                const { data: commits } = await github.rest.pulls.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number,
                  per_page: 100
                });
                const commitMessages = commits.map(c => `- ${c.commit.message}`).join('\n');

                const reviewable = files.filter(f =>
                  f.patch &&
                  !SKIP_PATTERNS.some(p => p.test(f.filename))
                );

                let diff = '';
                for (const file of reviewable) {
                  diff += `=== ${file.filename} (${file.status}, +${file.additions} -${file.deletions}) ===\n${file.patch}\n\n`;
                }
                if (diff.length > MAX_DIFF_SIZE) {
                  diff = diff.substring(0, MAX_DIFF_SIZE) + '\n\n... (diff truncated)';
                }

                const prompt = [
                  'Auto-fill a PR description. Analyze the title, commits, and diff below.',
                  '',
                  `PR Title: ${prTitle}`,
                  '',
                  'Commits:',
                  commitMessages,
                  '',
                  'Diff:',
                  diff,
                  '',
                  'Return ONLY markdown with these sections (do NOT add any text before the first ## header):',
                  '',
                  '## What type of PR is this?',
                  'Mark applicable types with [x]: feat, fix, docs, refactor, test, ci, chore',
                  '(Use format: - [x] `type` - Description)',
                  '',
                  '## Description',
                  '2-4 sentences on what changed and why.',
                  '',
                  '## Changes Overview',
                  'Brief bullet summary of files or areas changed.',
                  '',
                  '## How Has This Been Tested?',
                  'Mark applicable with [x]: Unit tests, Manual testing, N/A',
                  '(Use format: - [x] Item)',
                  '',
                  '## Checklist',
                  'Mark applicable with [x]: code style, self-review, tests added, tests pass, docs updated, i18n (en + zh ARB)',
                  '(Use format: - [x] Item)'
                ].join('\n');

                let apiResult;
                try {
                  const resp = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-api-key': process.env.ANTHROPIC_API_KEY,
                      'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                      model: 'claude-sonnet-4-5-20250929',
                      max_tokens: 2048,
                      messages: [{ role: 'user', content: prompt }]
                    })
                  });
                  if (!resp.ok) {
                    const errorText = await resp.text();
                    throw new Error(`HTTP ${resp.status}: ${errorText}`);
                  }
                  apiResult = await resp.json();
                } catch (e) {
                  failReason = `Claude API request failed: ${e.message}`;
                }

                if (!failReason) {
                  body = apiResult.content?.[0]?.text;
                  if (!body) {
                    core.warning('Empty response from Claude API; writing Diff size only');
                    body = prBody;
                  } else {
                    const firstHeaderIdx = body.search(/^## /m);
                    if (firstHeaderIdx > 0) {
                      const preamble = body.substring(0, firstHeaderIdx).trim();
                      body = body.substring(firstHeaderIdx);
                      if (preamble) {
                        body = body.replace(/(## Description[^\n]*\n)/, `$1\n${preamble}\n`);
                      }
                    }
                    body = body.replace(/^- \[ \] .+\n?/gm, '');
                    body = body.replace(/\n{3,}/g, '\n\n').trim();
                    console.log(`PR #${pull_number} description auto-filled by Claude`);
                  }
                }
              }
            } else if (isOpen) {
              console.log('PR body already has content, skipping Claude auto-fill');
            }

            body = upsertDiffSize(body);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              body
            });

            console.log(`PR #${pull_number} Diff size section updated`);

            if (failReason) {
              core.setFailed(failReason);
            }

  # Job 2: Claude Code review, kept in ONE sticky PR comment that each push
  # updates in place (findings table with fixed/open status) instead of
  # posting a new comment per commit.
  review:
    needs: [summarize]
    if: always() && github.event.pull_request.draft == false && (needs.summarize.result == 'success' || needs.summarize.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Load previous review and mark it in progress
        id: sticky
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- claude-review:sticky -->';
            const STATUS = /^> (🔄|✅|⚠️) .*$/m;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const prev = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && (c.body || '').includes(MARKER));

            fs.mkdirSync('.claude-review', { recursive: true });
            fs.writeFileSync('.claude-review/previous.md', prev ? prev.body : '');

            const status = `> 🔄 Reviewing \`${sha}\`…`;
            let body;
            if (!prev) {
              body = `## 🤖 Claude Code Review\n${MARKER}\n${status}\n`;
            } else if (STATUS.test(prev.body)) {
              body = prev.body.replace(STATUS, status);
            } else {
              body = prev.body.replace(MARKER, `${MARKER}\n${status}`);
            }

            const { data } = prev
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body })
              : await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.setOutput('comment_id', String(data.id));

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            Review this Flutter mobile app pull request. Focus on:
            - Logic errors, async/state bugs, and widget lifecycle issues
            - Security (auth token storage, API input validation)
            - Riverpod usage (ref.watch vs ref.read, provider placement)
            - API calls through services/apis/ — not directly from widgets
            - i18n: user-visible strings in app_en.arb, app_zh.arb and app_ja.arb
            - Shared UI: AppButton, AppInput, AppIconButton (not raw Material widgets in screen/)
            - Test coverage for behavior changes

            Skip lockfiles, generated l10n, and build artifacts.
            Follow docs/contributing.md, AGENTS.md and .agents/skills when applicable.
            The PR branch is already checked out in the working directory.

            ## One review, updated in place
            The previous review comment (empty on the first run) is in
            `.claude-review/previous.md`. Do NOT post any PR comment, inline
            comment or review yourself. Write the complete new comment body to
            `.claude-review/review.md`; a later step replaces the sticky comment
            with it.

            Rules for the findings table:
            - Keep every finding from the previous review, with the same ID (F1, F2, …),
              and re-check it against the current code:
              - `✅ Fixed` when the current code resolves it (add the short commit SHA if known)
              - `⏳ Open` when it still applies
              - `➖ Dropped` when it no longer applies (code removed, or it was wrong)
            - Add new findings with the next free IDs. Only real issues; no style nits.
            - Never delete rows. Sort: ⏳ Open first, then ✅ Fixed, then ➖ Dropped.

            Use exactly this layout:

            ```
            ## 🤖 Claude Code Review
            <!-- claude-review:sticky -->
            > ✅ Reviewed `<7-char head sha>` · ⏳ <open> open · ✅ <fixed> fixed · ➖ <dropped> dropped

            | ID | Status | Severity | Finding | Location |
            |----|--------|----------|---------|----------|
            | F1 | ⏳ Open | 🔴 Bug | One sentence: what breaks and when. | `lib/path.dart:42` |

            Severity: 🔴 Bug · 🟠 Risk · 🟡 Test gap / maintainability

            ### Summary
            2-4 sentences on the current state of the PR.

            <details><summary>Details</summary>

            Per open finding: why it is a problem and a suggested fix.
            </details>
            ```
            With no findings at all, keep the header and status line and write
            "No issues found." instead of the table.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 35
            --allowedTools "Read,Write,Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Publish review to the sticky comment
        if: always() && steps.sticky.outputs.comment_id
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- claude-review:sticky -->';
            const STATUS = /^> (🔄|✅|⚠️) .*$/m;
            const { owner, repo } = context.repo;
            const comment_id = Number('${{ steps.sticky.outputs.comment_id }}');
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '');
            let body = read('.claude-review/review.md');
            if (body) {
              if (!body.includes(MARKER)) body = `## 🤖 Claude Code Review\n${MARKER}\n${body}`;
            } else {
              // Review failed or was skipped: keep the previous findings.
              const failed = `> ⚠️ Review of \`${sha}\` did not finish — [workflow run](${runUrl})`;
              const prev = read('.claude-review/previous.md');
              body = !prev
                ? `## 🤖 Claude Code Review\n${MARKER}\n${failed}\n`
                : STATUS.test(prev) ? prev.replace(STATUS, failed) : prev.replace(MARKER, `${MARKER}\n${failed}`);
            }
            await github.rest.issues.updateComment({ owner, repo, comment_id, body });
